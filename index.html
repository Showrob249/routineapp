<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Daily Routine</title>

<link rel="manifest" href="manifest.json">

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#43a047,#1e88e5);
  color:white;
  text-align:center;
}

h1 { margin-top:30px; }

.container {
  background: rgba(0,0,0,0.3);
  padding:20px;
  border-radius:15px;
  width:350px;
  margin:20px auto;
}

input, button {
  padding:10px;
  border-radius:8px;
  border:none;
  margin:5px;
}

.add-btn { background:orange; color:white; }
.complete { background:green; color:white; }
.delete { background:red; color:white; }

.install-btn {
  position:fixed;
  left:20px;
  top:20px;
  background:red;
  color:white;
}
.timer { background:red; padding:5px 15px; border-radius:20px; display:inline-block; }
</style>
</head>

<body>

<button id="installBtn" class="install-btn" style="display:none;">Install App</button>

<h1>📅 My Daily Routine</h1>

<div class="container">
  <input type="text" id="taskInput" placeholder="Task Name">
  <input type="time" id="timeInput">
  <br>
  <button class="add-btn" onclick="addTask()">Add Task</button>
</div>

<div id="taskList"></div>

<audio id="alarmSound" loop>
<source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let deferredPrompt;

function saveTasks() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function renderTasks() {
  let list = document.getElementById("taskList");
  list.innerHTML = "";

  tasks.forEach((task,index) => {
    list.innerHTML += `
    <div class="container">
      <h3>${task.name}</h3>
      <p>${task.time}</p>
      <div class="timer" id="timer-${index}">Waiting</div><br>
      <button class="complete" onclick="completeTask(${index})">Completed</button>
      <button class="delete" onclick="deleteTask(${index})">Delete</button>
    </div>
    `;
  });
}

function addTask() {
  let name = document.getElementById("taskInput").value;
  let time = document.getElementById("timeInput").value;
  if(!name || !time) return;

  tasks.push({name,time,completed:false});
  saveTasks();
  renderTasks();
}

function deleteTask(i){
  tasks.splice(i,1);
  saveTasks();
  renderTasks();
}

function completeTask(i){
  document.getElementById("alarmSound").pause();
  document.getElementById("alarmSound").currentTime = 0;
  tasks[i].completed = true;
  saveTasks();
}

function checkAlarm(){
  let now = new Date();
  let current = now.toTimeString().slice(0,5);

  tasks.forEach((task,index)=>{
    if(task.time === current && !task.completed){
      document.getElementById("alarmSound").play();
      if(Notification.permission==="granted"){
        new Notification("⏰ Time to Complete Task!");
      }
      document.getElementById(`timer-${index}`).innerText="00:00";
    }
  });
}

setInterval(checkAlarm,1000);

Notification.requestPermission();

renderTasks();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}

window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBtn").style.display="block";
});

document.getElementById("installBtn").addEventListener("click", async ()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt = null;
  }
});
</script>

</body>
</html>

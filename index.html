<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 My Daily Routine</title>

<link rel="manifest" href="manifest.json">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#141E30,#243B55);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
  color:white;
}

/* HEADER */
h1{
  margin:20px 0;
  font-size:28px;
  color:#00ffcc;
}

/* CARD */
.card{
  width:100%;
  max-width:380px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 8px 30px rgba(0,0,0,0.4);
  transition:0.3s;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  border:none;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  margin:5px 5px 0 0;
}

/* BUTTON COLORS */
.add{background:#ff9800;color:white;width:100%;}
.complete{background:#4caf50;color:white;}
.delete{background:#f44336;color:white;}

/* 🔥 ACTIVE GLOW */
.active-glow{
  box-shadow:0 0 25px yellow;
  border:2px solid yellow;
}

/* 🔥 RED PULSE */
@keyframes pulseRed{
  0%{box-shadow:0 0 0 0 rgba(255,0,0,0.7);}
  70%{box-shadow:0 0 0 25px rgba(255,0,0,0);}
  100%{box-shadow:0 0 0 0 rgba(255,0,0,0);}
}
.alarm-active{
  animation:pulseRed 1s infinite;
  border:2px solid red;
}

/* ✅ COMPLETED */
.completed-task{
  background:rgba(76,175,80,0.2)!important;
  border:2px solid #4caf50;
  box-shadow:0 0 20px rgba(76,175,80,0.7);
}

/* 🔥 SCREEN SHAKE */
@keyframes shake{
  0%{transform:translate(0,0);}
  25%{transform:translate(-5px,5px);}
  50%{transform:translate(5px,-5px);}
  75%{transform:translate(-5px,5px);}
  100%{transform:translate(0,0);}
}
.shake-screen{
  animation:shake 0.4s infinite;
}

/* 🔴 FULL RED ALERT */
#redAlert{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:#b00000;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
  animation:redFlash 0.8s infinite alternate;
}
#redAlert h1{
  font-size:40px;
}
@keyframes redFlash{
  from{background:#b00000;}
  to{background:#ff0000;}
}
</style>
</head>
<body>

<h1>🔥 My Daily Routine</h1>

<div class="card">
  <input type="text" id="taskName" placeholder="Task Name">
  <input type="time" id="taskTime">
  <button class="add" onclick="addTask()">Add Task</button>
</div>

<div id="taskContainer"></div>

<!-- RED ALERT SCREEN -->
<div id="redAlert">
  <h1>🚨 TASK TIME 🚨</h1>
  <p>Complete Your Task Now!</p>
</div>

<audio id="alarm" loop>
<source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function save(){localStorage.setItem("tasks",JSON.stringify(tasks));}

function render(){
  const container=document.getElementById("taskContainer");
  container.innerHTML="";
  tasks.forEach((task,i)=>{
    container.innerHTML+=`
      <div class="card" id="card-${i}">
        <h3>${task.name}</h3>
        <p>${task.time}</p>
        <button class="complete" onclick="completeTask(${i})">Completed</button>
        <button class="delete" onclick="deleteTask(${i})">Delete</button>
      </div>
    `;
  });
}

function addTask(){
  const name=document.getElementById("taskName").value;
  const time=document.getElementById("taskTime").value;
  if(!name||!time)return;
  tasks.push({name,time,completed:false});
  save();render();
}

function deleteTask(i){
  tasks.splice(i,1);
  save();render();
}

function completeTask(i){
  tasks[i].completed=true;
  save();

  let card=document.getElementById("card-"+i);
  card.classList.remove("alarm-active","active-glow");
  card.classList.add("completed-task");

  document.getElementById("alarm").pause();
  document.getElementById("alarm").currentTime=0;
  document.body.classList.remove("shake-screen");
  document.getElementById("redAlert").style.display="none";
}

function checkTime(){
  const now=new Date().toTimeString().slice(0,5);
  tasks.forEach((task,i)=>{
    if(task.time===now && !task.completed){
      document.getElementById("alarm").play();
      document.body.classList.add("shake-screen");
      document.getElementById("redAlert").style.display="flex";

      let card=document.getElementById("card-"+i);
      card.classList.add("active-glow","alarm-active");

      if(Notification.permission==="granted"){
        new Notification("⏰ Time to Complete Task!");
      }
    }
  });
}

setInterval(checkTime,1000);
Notification.requestPermission();
render();
</script>

</body>
</html>

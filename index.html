<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Daily Routine</title>
<link rel="manifest" href="manifest.json">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background: linear-gradient(135deg,#141E30,#243B55);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
  color:white;
}

h1{
  margin:20px 0 30px;
  font-size:26px;
  font-weight:600;
  letter-spacing:1px;
}

.card{
  width:100%;
  max-width:380px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 8px 30px rgba(0,0,0,0.4);
  transition:0.3s ease;
}

.card:hover{
  transform: translateY(-5px);
}

input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:12px;
  border:none;
  outline:none;
  background: rgba(255,255,255,0.15);
  color:white;
  font-size:14px;
}

input::placeholder{
  color:#ddd;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:12px;
  font-weight:500;
  cursor:pointer;
  transition:0.2s;
}

.add{
  width:100%;
  background: linear-gradient(135deg,#ff9800,#ff5722);
  color:white;
}

.complete{
  background:#4caf50;
  color:white;
}

.delete{
  background:#f44336;
  color:white;
}

button:hover{
  opacity:0.85;
}

.install{
  position:fixed;
  top:20px;
  left:20px;
  padding:8px 15px;
  border-radius:25px;
  background: linear-gradient(135deg,#ff416c,#ff4b2b);
  color:white;
  display:none;
  box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

.timer{
  margin-top:10px;
  display:inline-block;
  padding:6px 15px;
  border-radius:20px;
  background:#ff3d3d;
  font-weight:bold;
}
</style>
</head>
<body>

<button id="installBtn" class="install">Install App</button>

<h1>📅 My Daily Routine</h1>

<div class="card">
<input type="text" id="taskName" placeholder="Task Name">
<input type="time" id="taskTime">
<button class="add" onclick="addTask()">Add Task</button>
</div>

<div id="tasks"></div>

<audio id="alarm" loop>
<source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let deferredPrompt;

function save(){
  localStorage.setItem("tasks",JSON.stringify(tasks));
}

function render(){
  const container=document.getElementById("tasks");
  container.innerHTML="";
  tasks.forEach((task,i)=>{
    container.innerHTML+=`
    <div class="card">
      <h3>${task.name}</h3>
      <p>${task.time}</p>
      <div class="timer" id="timer-${i}">Waiting</div>
      <div style="margin-top:10px;">
      <button class="complete" onclick="completeTask(${i})">Completed</button>
      <button class="delete" onclick="deleteTask(${i})">Delete</button>
      </div>
    </div>`;
  });
}

function addTask(){
  const name=document.getElementById("taskName").value;
  const time=document.getElementById("taskTime").value;
  if(!name || !time) return;
  tasks.push({name,time,completed:false});
  save();
  render();
}

function deleteTask(i){
  tasks.splice(i,1);
  save();
  render();
}

function completeTask(i){
  tasks[i].completed=true;
  document.getElementById("alarm").pause();
  document.getElementById("alarm").currentTime=0;
  save();
}

function checkTime(){
  const now=new Date().toTimeString().slice(0,5);
  tasks.forEach((task,i)=>{
    if(task.time===now && !task.completed){
      document.getElementById("alarm").play();
      document.getElementById(`timer-${i}`).innerText="00:00";
      navigator.serviceWorker.ready.then(reg=>{
        reg.showNotification("⏰ Time to Complete Task!",{
          body:task.name,
          icon:"icon-192.png"
        });
      });
    }
  });
}

setInterval(checkTime,1000);

Notification.requestPermission();

render();

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js");
}

window.addEventListener("beforeinstallprompt",(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  document.getElementById("installBtn").style.display="block";
});

document.getElementById("installBtn").addEventListener("click",()=>{
  deferredPrompt.prompt();
});
</script>

</body>
</html>

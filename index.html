<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Routine</title>

<link rel="manifest" href="./manifest.json">

<style>
body{
margin:0;
font-family:sans-serif;
background:#0f172a;
color:white;
text-align:center;
}

h1{
margin-top:20px;
color:#00f2ff;
}

input{
padding:10px;
margin:5px;
border-radius:8px;
border:none;
}

button{
padding:10px 20px;
margin:5px;
border:none;
border-radius:8px;
background:#00f2ff;
font-weight:bold;
cursor:pointer;
}

.card{
background:#1e293b;
margin:15px auto;
padding:20px;
width:90%;
max-width:400px;
border-radius:15px;
transition:0.3s;
box-shadow:0 0 10px #000;
}

.active{
box-shadow:0 0 20px #00f2ff;
}

.completed{
background:#16a34a;
}

.red{
animation:redFlash 0.5s infinite;
}

@keyframes redFlash{
0%{background:#7f1d1d;}
50%{background:#ff0000;}
100%{background:#7f1d1d;}
}

.install-btn{
background:#22c55e;
}
</style>
</head>
<body>

<h1>🔥 Focus Routine</h1>

<input type="text" id="taskName" placeholder="Task Name">
<input type="time" id="taskTime">
<button onclick="addTask()">Add Task</button>

<br>
<button id="installBtn" class="install-btn" style="display:none;">Install App</button>

<div id="taskList"></div>

<script>

if('serviceWorker' in navigator){
navigator.serviceWorker.register('./sw.js');
}

let tasks=[];
let audio=new Audio("./alarm.mp3");
audio.preload="auto";

/* Unlock audio on first click */
document.body.addEventListener("click",()=>{
audio.play().then(()=>audio.pause()).catch(()=>{});
},{once:true});

function addTask(){
let name=document.getElementById("taskName").value;
let time=document.getElementById("taskTime").value;

if(!name||!time){
alert("Enter task & time");
return;
}

tasks.push({id:Date.now(),name,time,done:false});
render();
}

function render(){
let list=document.getElementById("taskList");
list.innerHTML="";
tasks.forEach(t=>{
let div=document.createElement("div");
div.className="card";
div.id="task-"+t.id;
div.innerHTML=`
<h3>${t.name}</h3>
<p>${t.time}</p>
<button onclick="complete(${t.id})">Complete</button>
`;
list.appendChild(div);
});
}

function complete(id){
let t=tasks.find(x=>x.id===id);
t.done=true;
document.getElementById("task-"+id).classList.add("completed");
audio.pause();
audio.currentTime=0;
}

function checkTime(){
let now=new Date().toTimeString().slice(0,5);
tasks.forEach(t=>{
if(t.time===now && !t.done){
trigger(t.id);
}
});
}

function trigger(id){
let card=document.getElementById("task-"+id);
card.classList.add("red");

audio.currentTime=0;
audio.play().catch(()=>{});

navigator.serviceWorker.ready.then(reg=>{
reg.showNotification("⏰ "+tasks.find(t=>t.id===id).name,{
body:"Time Up!",
icon:"./icon.png"
});
});
}

setInterval(checkTime,1000);

/* INSTALL BUTTON */
let deferredPrompt;
window.addEventListener("beforeinstallprompt",(e)=>{
e.preventDefault();
deferredPrompt=e;
document.getElementById("installBtn").style.display="inline-block";
});

document.getElementById("installBtn").addEventListener("click",()=>{
deferredPrompt.prompt();
});

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Smart Routine</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
}

h1{margin-top:20px;}

.container{
  max-width:420px;
  margin:auto;
  padding:20px;
}

.glass{
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(15px);
  padding:15px;
  border-radius:15px;
  margin-top:20px;
}

input,button{
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
}

button{
  cursor:pointer;
  font-weight:bold;
}

.addBtn{background:#10b981;color:white;}
.deleteBtn{background:#ef4444;color:white;}
.completeBtn{background:#3b82f6;color:white;}

.task{
  padding:15px;
  margin-top:15px;
  border-radius:12px;
  background:white;
  color:black;
  transition:0.3s;
}

.red{background:#ef4444;color:white;}
.green{background:#10b981;color:white;}

.progressBar{
  width:100%;
  background:#334155;
  border-radius:10px;
  overflow:hidden;
  margin-top:15px;
}

.progress{
  height:15px;
  width:0%;
  background:#10b981;
  transition:0.4s;
}

#installBtn{
  display:none;
  background:#f59e0b;
  color:white;
}
</style>
</head>

<body>

<h1>⚡ Ultra Smart Routine</h1>

<button id="installBtn">Install App</button>

<div class="container">

<div class="glass">
<input type="text" id="taskName" placeholder="Task name">
<input type="time" id="taskTime">
<button class="addBtn" onclick="addTask()">Add Task</button>
</div>

<div class="progressBar">
<div class="progress" id="progress"></div>
</div>
<p id="percentText">0% Completed</p>

<div id="taskList"></div>

</div>



<script>

let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let alarmInterval = null;
let audioContext = null;

/* SAVE */
function saveTasks(){
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

/* RENDER */
function renderTasks(){
  const list = document.getElementById("taskList");
  list.innerHTML = "";

  tasks.forEach((task,index)=>{

    const div = document.createElement("div");
    div.className = "task";

    if(task.alarm) div.classList.add("red");
    if(task.completed) div.classList.add("green");

    div.innerHTML = `
      <strong>${task.name}</strong><br>
      ⏰ ${task.time}<br><br>
      <button class="completeBtn" onclick="completeTask(${index})">Complete</button>
      <button class="deleteBtn" onclick="deleteTask(${index})">Delete</button>
    `;

    list.appendChild(div);
  });

  updateProgress();
}

/* ADD */
function addTask(){

  unlockAudio(); // 🔥 important

  const name = document.getElementById("taskName").value;
  const time = document.getElementById("taskTime").value;

  if(!name || !time){
    alert("Enter task & time");
    return;
  }

  const task = {
    name,
    time,
    completed:false,
    alarm:false
  };

  tasks.push(task);
  saveTasks();
  scheduleAlarm(task);
  renderTasks();

  document.getElementById("taskName").value="";
}

/* DELETE */
function deleteTask(index){
  tasks.splice(index,1);
  saveTasks();
  renderTasks();
}

/*

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>My Daily Routine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background: black;
      color: #00ffe0;
      text-align: center;
      font-family: Arial;
      padding: 20px;
    }
    input, button {
      padding: 10px;
      margin: 5px;
      border-radius: 8px;
      border: none;
    }
    button {
      background: #00ffe0;
      cursor: pointer;
      font-weight: bold;
    }
    .task {
      background: #111;
      margin: 10px;
      padding: 10px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<h1>🔥 My Daily Routine</h1>

<button onclick="enableNotification()">Enable Notifications</button>

<h2>Add Task</h2>
<input type="text" id="taskName" placeholder="Task Name">
<input type="time" id="taskTime">
<button onclick="addTask()">Add</button>

<h2>Today's Schedule</h2>
<div id="taskList"></div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

function enableNotification() {
  Notification.requestPermission();
}

let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function saveTasks() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function renderTasks() {
  let list = document.getElementById("taskList");
  list.innerHTML = "";

  tasks.forEach((task, index) => {
    list.innerHTML += `
      <div class="task">
        <b>${task.name}</b> - ${task.time}
        <button onclick="deleteTask(${index})">❌</button>
      </div>
    `;
  });
}

function addTask() {
  let name = document.getElementById("taskName").value;
  let time = document.getElementById("taskTime").value;

  if (!name || !time) {
    alert("Enter task & time");
    return;
  }

  tasks.push({ name, time });
  saveTasks();
  renderTasks();

  document.getElementById("taskName").value = "";
  document.getElementById("taskTime").value = "";
}

function deleteTask(index) {
  tasks.splice(index, 1);
  saveTasks();
  renderTasks();
}

function checkReminder() {
  let now = new Date();
  let currentTime = now.toTimeString().slice(0,5);

  tasks.forEach(task => {
    if (task.time === currentTime) {
      if (Notification.permission === "granted") {
        navigator.serviceWorker.ready.then(reg => {
          reg.showNotification("🔔 " + task.name, {
            body: "Time to complete your task!",
            icon: "icon.png"
          });
        });
      }
    }
  });
}

setInterval(checkReminder, 60000); // check every 1 min

renderTasks();
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Daily Routine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <h2>Daily Routine App</h2>

  <input type="text" id="taskInput" placeholder="Enter task">
  <input type="time" id="timeInput">
  <button onclick="addTask()">Add Task</button>

  <ul id="taskList"></ul>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let alarm = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");
alarm.loop = true;
let activeAlarmIndex = null;

function saveTasks() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function renderTasks() {
  let list = document.getElementById("taskList");
  list.innerHTML = "";

  tasks.forEach((task, index) => {
    let li = document.createElement("li");

    li.innerHTML = `
      ${task.text} - ${task.time}
      ${task.completed ? "✅ Done" : ""}
      <button onclick="completeTask(${index})">Complete</button>
    `;

    list.appendChild(li);
  });
}

function addTask() {
  let text = document.getElementById("taskInput").value;
  let time = document.getElementById("timeInput").value;

  if (!text || !time) return alert("Enter task & time");

  tasks.push({
    text,
    time,
    completed: false,
    lastNotified: ""
  });

  saveTasks();
  renderTasks();

  document.getElementById("taskInput").value = "";
  document.getElementById("timeInput").value = "";
}

function completeTask(index) {
  tasks[index].completed = true;

  if (activeAlarmIndex === index) {
    alarm.pause();
    alarm.currentTime = 0;
    activeAlarmIndex = null;
  }

  saveTasks();
  renderTasks();
}

function checkReminder() {
  let now = new Date();
  let currentTime = now.toTimeString().slice(0,5);
  let today = now.toDateString();

  tasks.forEach((task, index) => {
    if (
      task.time === currentTime &&
      task.lastNotified !== today &&
      !task.completed
    ) {
      alarm.play();
      activeAlarmIndex = index;

      task.lastNotified = today;
      saveTasks();
    }
  });
}

setInterval(checkReminder, 1000);

// unlock sound after first click
document.body.addEventListener("click", function unlock() {
  alarm.play().then(() => {
    alarm.pause();
    alarm.currentTime = 0;
  });
  document.body.removeEventListener("click", unlock);
});

renderTasks();
</script>

</body>
</html>

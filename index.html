<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 My Routine</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial;
  text-align:center;
}

h1{
  margin-top:40px;
  color:#00ffcc;
}

input,button{
  padding:10px;
  margin:5px;
  font-size:16px;
}

button{
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#00ffcc;
}

.task{
  background:#111;
  margin:15px auto;
  padding:15px;
  width:90%;
  max-width:400px;
  border-radius:10px;
  transition:0.3s;
}

.active{
  box-shadow:0 0 20px red;
}

.completed{
  background:green;
}

/* RED ALERT */
@keyframes flash{
  0%{background:black;}
  50%{background:darkred;}
  100%{background:black;}
}

.alert{
  animation:flash 1s infinite;
}
</style>
</head>

<body>

<h1>🔥 My Routine</h1>

<input type="text" id="taskName" placeholder="Task Name">
<input type="time" id="taskTime">
<button onclick="addTask()">Add</button>

<div id="list"></div>

<audio id="alarm" loop>
  <source src="alarm.mp3" type="audio/mpeg">
</audio>

<script>
let tasks=[];

function addTask(){
  let name=document.getElementById("taskName").value;
  let time=document.getElementById("taskTime").value;
  if(!name||!time) return alert("Enter task & time");

  tasks.push({id:Date.now(),name,time,done:false});
  render();
}

function render(){
  let list=document.getElementById("list");
  list.innerHTML="";
  tasks.forEach(t=>{
    let div=document.createElement("div");
    div.className="task";
    div.id="task-"+t.id;
    div.innerHTML=`
      <h3>${t.name}</h3>
      <p>${t.time}</p>
      <button onclick="complete(${t.id})">Completed</button>
    `;
    list.appendChild(div);
  });
}

function complete(id){
  let t=tasks.find(x=>x.id===id);
  t.done=true;

  document.getElementById("alarm").pause();
  document.getElementById("alarm").currentTime=0;
  document.body.classList.remove("alert");

  document.getElementById("task-"+id).classList.add("completed");
}

function check(){
  let now=new Date().toTimeString().slice(0,5);
  tasks.forEach(t=>{
    if(t.time===now && !t.done){
      document.getElementById("alarm").play();
      document.body.classList.add("alert");
      document.getElementById("task-"+t.id).classList.add("active");
    }
  });
}

setInterval(check,1000);

/* Service Worker Register */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 Routine App</title>
<link rel="manifest" href="./manifest.json">

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

h1{color:#00f2ff;margin-top:20px;}

input,button{
padding:10px;
margin:5px;
border-radius:6px;
border:none;
}

button{
background:#00f2ff;
font-weight:bold;
cursor:pointer;
}

.card{
background:#111827;
margin:15px auto;
padding:15px;
width:90%;
max-width:400px;
border-radius:12px;
transition:0.3s;
}

.active{box-shadow:0 0 20px #00f2ff;}
.completed{background:#16a34a;}

.redpulse{animation:redpulse 0.5s infinite;}

@keyframes redpulse{
0%{background:#7f1d1d;}
50%{background:#ff0000;}
100%{background:#7f1d1d;}
}

.fullscreen-alert{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:red;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
font-weight:bold;
z-index:999;
animation:shake 0.4s infinite;
}

@keyframes shake{
0%{transform:translateX(0);}
25%{transform:translateX(-15px);}
50%{transform:translateX(15px);}
75%{transform:translateX(-15px);}
100%{transform:translateX(0);}
}
</style>
</head>
<body>

<h1>🔥 Routine App</h1>

<input type="text" id="taskName" placeholder="Task name">
<input type="time" id="taskTime">
<button onclick="addTask()">Add Task</button>

<div id="taskList"></div>

<script>

if('serviceWorker' in navigator){
navigator.serviceWorker.register('./sw.js');
}

let tasks=[];
let audio=new Audio("./alarm.mp3");

function addTask(){
let name=document.getElementById("taskName").value;
let time=document.getElementById("taskTime").value;

if(!name || !time){
alert("Enter task and time");
return;
}

let task={
id:Date.now(),
name,
time,
done:false
};

tasks.push(task);
renderTasks();
}

function renderTasks(){
let list=document.getElementById("taskList");
list.innerHTML="";

tasks.forEach(t=>{
let div=document.createElement("div");
div.className="card";
div.id="task-"+t.id;

div.innerHTML=`
<h3>${t.name}</h3>
<p>${t.time}</p>
<button onclick="completeTask(${t.id})">Complete</button>
`;

list.appendChild(div);
});
}

function completeTask(id){
let t=tasks.find(x=>x.id===id);
t.done=true;

document.getElementById("task-"+id).classList.add("completed");

audio.pause();
audio.currentTime=0;

document.body.classList.remove("redpulse");
}

function checkTime(){
let now=new Date();
let current=now.toTimeString().slice(0,5);

tasks.forEach(t=>{
if(t.time===current && !t.done){
triggerAlarm(t.id);
}
});
}

function triggerAlarm(id){

let card=document.getElementById("task-"+id);
card.classList.add("redpulse");

audio.currentTime=0;
audio.play().catch(()=>{});

navigator.serviceWorker.ready.then(reg=>{
reg.showNotification("⏰ "+tasks.find(t=>t.id===id).name,{
body:"Time is up!",
icon:"./icon.png",
vibrate:[200,100,200]
});
});

let alertDiv=document.createElement("div");
alertDiv.className="fullscreen-alert";
alertDiv.innerHTML="⏰ TIME UP!";
document.body.appendChild(alertDiv);

setTimeout(()=>{
alertDiv.remove();
},5000);
}

setInterval(checkTime,1000);

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Daily Routine App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="/routineapp/manifest.json">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
      text-align: center;
      padding-top: 100px;
    }

    h1 {
      color: #00ffd5;
    }

    button {
      padding: 12px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      background: #00ffd5;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <h1>🔥 My Daily Routine</h1>

  <button onclick="enableNotification()">Enable Notifications</button>
  <button onclick="sendNotification()">Test Notification</button>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/routineapp/sw.js')
        .then(() => console.log("Service Worker Registered"));
    }

    function enableNotification() {
      Notification.requestPermission().then(permission => {
        if (permission === "granted") {
          alert("Notification Enabled ✅");
        } else {
          alert("Permission Denied ❌");
        }
      });
    }

    function sendNotification() {
      if (Notification.permission === "granted") {
        navigator.serviceWorker.ready.then(reg => {
          reg.showNotification("Daily Routine Reminder 🔔", {
            body: "Time to complete your task!",
            icon: "/routineapp/icon.png"
          });
        });
      } else {
        alert("Please enable notification first");
      }
    }
  </script>

</body>
</html>

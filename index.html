<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Daily Routine</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4CAF50">

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #4CAF50, #2196F3);
  color: white;
  text-align: center;
  margin: 0;
  padding: 20px;
}

.container {
  background: rgba(0,0,0,0.3);
  padding: 20px;
  border-radius: 15px;
  max-width: 400px;
  margin: auto;
}

input, button {
  padding: 10px;
  margin: 5px;
  border-radius: 8px;
  border: none;
}

button {
  background: #ff9800;
  color: white;
  cursor: pointer;
}

.task {
  background: white;
  color: black;
  margin: 10px 0;
  padding: 10px;
  border-radius: 8px;
}

#installBtn {
  display: none;
  background: red;
}
</style>
</head>

<body>

<h2>📅 My Daily Routine</h2>

<button id="installBtn">Install App</button>

<div class="container">
  <input type="text" id="taskInput" placeholder="Task name">
  <input type="time" id="timeInput">
  <button onclick="addTask()">Add Task</button>

  <div id="taskList"></div>
</div>

<audio id="alarmSound" src="alarm.mp3" loop></audio>

<script>

let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "block";
});

installBtn.addEventListener("click", async () => {
  installBtn.style.display = "none";
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
});

function addTask() {
  const name = document.getElementById("taskInput").value;
  const time = document.getElementById("timeInput").value;

  if (!name || !time) return alert("Enter task & time");

  const div = document.createElement("div");
  div.className = "task";
  div.innerHTML = `
    <b>${name}</b><br>
    ⏰ ${time}
    <br><br>
    <button onclick="completeTask(this)">Completed</button>
  `;

  document.getElementById("taskList").appendChild(div);

  scheduleAlarm(name, time);
}

function scheduleAlarm(name, time) {
  const now = new Date();
  const alarmTime = new Date();

  const [hour, minute] = time.split(":");
  alarmTime.setHours(hour);
  alarmTime.setMinutes(minute);
  alarmTime.setSeconds(0);

  const diff = alarmTime - now;

  if (diff > 0) {
    setTimeout(() => {
      document.getElementById("alarmSound").play();
      showNotification(name);
    }, diff);
  }
}

function completeTask(btn) {
  document.getElementById("alarmSound").pause();
  document.getElementById("alarmSound").currentTime = 0;
  btn.parentElement.remove();
}

function showNotification(taskName) {
  if (Notification.permission === "granted") {
    new Notification("⏰ Task Reminder", {
      body: taskName
    });
  }
}

if ("Notification" in window) {
  Notification.requestPermission();
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}

</script>

</body>
</html>

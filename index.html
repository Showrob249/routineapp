<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 My Routine</title>

<link rel="manifest" href="manifest.json">

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
overflow-x:hidden;
}

h1{
margin-top:20px;
color:#00f2ff;
}

.container{
padding:20px;
}

.card{
background:#111827;
padding:25px;
margin:20px auto;
width:90%;
max-width:400px;
border-radius:15px;
transition:0.4s;
box-shadow:0 0 10px #000;
}

.active{
box-shadow:0 0 30px #00f2ff;
}

.completed{
background:#16a34a;
transform:scale(1.05);
}

.redpulse{
animation:redpulse 0.5s infinite;
}

@keyframes redpulse{
0%{background:#7f1d1d;}
50%{background:#ff0000;}
100%{background:#7f1d1d;}
}

button{
padding:10px 20px;
margin-top:10px;
border:none;
border-radius:8px;
background:#00f2ff;
color:black;
cursor:pointer;
font-weight:bold;
}

.fullscreen-alert{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:red;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
font-weight:bold;
z-index:999;
animation:shake 0.4s infinite;
}

@keyframes shake{
0%{transform:translateX(0);}
25%{transform:translateX(-15px);}
50%{transform:translateX(15px);}
75%{transform:translateX(-15px);}
100%{transform:translateX(0);}
}
</style>
</head>
<body>

<h1>🔥 My Routine</h1>

<div class="container">
<div id="taskCard" class="card">
<h3>Trading Session</h3>
<button onclick="startTask()">Start</button>
<button onclick="completeTask()">Complete</button>
</div>
</div>

<script>
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js');
}

let alarmTimeout;
let audio = new Audio("alarm.mp3");

function startTask(){

Notification.requestPermission();

let card=document.getElementById("taskCard");
card.classList.add("active");

alarmTimeout=setTimeout(()=>{
triggerAlarm();
},5000);

}

function triggerAlarm(){

let card=document.getElementById("taskCard");
card.classList.add("redpulse");

let alertDiv=document.createElement("div");
alertDiv.className="fullscreen-alert";
alertDiv.innerHTML="⏰ TIME UP!";
document.body.appendChild(alertDiv);

audio.play().catch(()=>{});

navigator.serviceWorker.ready.then(reg=>{
reg.showNotification("⏰ Task Time Up!",{
body:"Your routine time is finished!",
icon:"icon.png",
vibrate:[200,100,200]
});
});

setTimeout(()=>{
alertDiv.remove();
card.classList.remove("redpulse");
},5000);
}

function completeTask(){

clearTimeout(alarmTimeout);

let card=document.getElementById("taskCard");
card.classList.remove("active");
card.classList.remove("redpulse");
card.classList.add("completed");

}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Red Alert Test</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
  text-align: center;
  padding-top: 100px;
}

/* 🔥 Red Flash Animation */
@keyframes redFlash {
  0% { background: black; }
  50% { background: darkred; }
  100% { background: black; }
}

.red-alert {
  animation: redFlash 1s infinite;
}

/* 🔥 Overlay */
.alert-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(139,0,0,0.95);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 60px;
  font-weight: bold;
  z-index: 9999;
}

button {
  padding: 15px 30px;
  font-size: 18px;
  margin: 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>🔥 Red Alert Demo</h1>

<button onclick="startAlert()">Start Alarm</button>
<button onclick="stopAlert()">Completed</button>

<audio id="alarm" loop>
  <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>

<script>
function startAlert() {
  document.getElementById("alarm").play();
  document.body.classList.add("red-alert");

  let overlay = document.createElement("div");
  overlay.className = "alert-overlay";
  overlay.id = "alertBox";
  overlay.innerHTML = "🚨 WAKE UP 🚨";

  document.body.appendChild(overlay);
}

function stopAlert() {
  let alarm = document.getElementById("alarm");
  alarm.pause();
  alarm.currentTime = 0;

  document.body.classList.remove("red-alert");

  let overlay = document.getElementById("alertBox");
  if (overlay) overlay.remove();
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Daily Routine</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background: linear-gradient(135deg,#667eea,#764ba2);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:95%;
  max-width:400px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(15px);
  padding:20px;
  border-radius:20px;
  color:white;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h2{
  text-align:center;
}

input,button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  border-radius:10px;
}

button{
  background:#00c9a7;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

ul{
  list-style:none;
  padding:0;
}

li{
  background:rgba(255,255,255,0.2);
  margin:5px 0;
  padding:10px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.progress-container{
  background:rgba(255,255,255,0.2);
  height:10px;
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#00ffcc;
  transition:0.4s;
}
</style>
</head>

<body>

<div class="container">
<h2>Daily Routine</h2>

<input type="text" id="taskInput" placeholder="Enter task">
<input type="time" id="timeInput">
<button onclick="addTask()">Add Task</button>

<ul id="taskList"></ul>

<div class="progress-container">
  <div class="progress-bar" id="progressBar"></div>
</div>
<p id="progressText">0% Completed</p>

</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let alarm = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");
alarm.loop = true;
let activeAlarmIndex = null;

function saveTasks(){
  localStorage.setItem("tasks",JSON.stringify(tasks));
}

function renderTasks(){
  let list = document.getElementById("taskList");
  list.innerHTML="";
  tasks.forEach((task,index)=>{
    let li=document.createElement("li");

    li.innerHTML=`
      <span>${task.text} (${task.time}) ${task.completed?"✅":""}</span>
      <button onclick="completeTask(${index})">✔</button>
    `;
    list.appendChild(li);
  });

  updateProgress();
}

function addTask(){
  let text=document.getElementById("taskInput").value;
  let time=document.getElementById("timeInput").value;

  if(!text||!time) return alert("Enter task & time");

  tasks.push({
    text,
    time,
    completed:false,
    lastNotified:""
  });

  saveTasks();
  renderTasks();

  document.getElementById("taskInput").value="";
  document.getElementById("timeInput").value="";
}

function completeTask(index){
  tasks[index].completed=true;

  if(activeAlarmIndex===index){
    alarm.pause();
    alarm.currentTime=0;
    activeAlarmIndex=null;
  }

  saveTasks();
  renderTasks();
}

function checkReminder(){
  let now=new Date();
  let currentTime=now.toTimeString().slice(0,5);
  let today=now.toDateString();

  tasks.forEach((task,index)=>{
    if(task.time===currentTime && task.lastNotified!==today && !task.completed){
      alarm.play();
      activeAlarmIndex=index;
      task.lastNotified=today;
      saveTasks();
    }
  });
}

function updateProgress(){
  let total=tasks.length;
  let done=tasks.filter(t=>t.completed).length;
  let percent= total===0 ? 0 : Math.round((done/total)*100);

  document.getElementById("progressBar").style.width=percent+"%";
  document.getElementById("progressText").innerText=percent+"% Completed";
}

setInterval(checkReminder,1000);

// unlock sound
document.body.addEventListener("click",function unlock(){
  alarm.play().then(()=>{
    alarm.pause();
    alarm.currentTime=0;
  });
  document.body.removeEventListener("click",unlock);
});

renderTasks();
</script>

</body>
</html>

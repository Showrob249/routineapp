<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Smart Routine</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg,#1f2937,#111827);
  color: white;
  text-align: center;
}

h1 { margin-top:20px; }

.container {
  max-width:400px;
  margin:auto;
  padding:20px;
}

input,button {
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
}

button {
  background:#10b981;
  color:white;
  cursor:pointer;
}

.task {
  background:white;
  color:black;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
}

#installBtn {
  display:none;
  background:#ef4444;
}
</style>
</head>

<body>

<h1>📅 Smart Routine</h1>

<button id="installBtn">Install App</button>

<div class="container">
  <input type="text" id="taskName" placeholder="Task name">
  <input type="time" id="taskTime">
  <button onclick="addTask()">Add Task</button>

  <div id="taskList"></div>
</div>

<audio id="alarm" src="alarm.mp3" loop></audio>

<script>
let deferredPrompt;
const installBtn=document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt",(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  installBtn.style.display="block";
});

installBtn.onclick=async()=>{
  installBtn.style.display="none";
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
};

function addTask(){
  const name=document.getElementById("taskName").value;
  const time=document.getElementById("taskTime").value;

  if(!name||!time){ alert("Enter task & time"); return;}

  const div=document.createElement("div");
  div.className="task";
  div.innerHTML=`
  <b>${name}</b><br>
  ⏰ ${time}<br><br>
  <button onclick="completeTask(this)">Completed</button>
  `;

  document.getElementById("taskList").appendChild(div);
  scheduleAlarm(name,time);
}

function scheduleAlarm(name,time){
  const now=new Date();
  const alarmTime=new Date();
  const [h,m]=time.split(":");
  alarmTime.setHours(h);
  alarmTime.setMinutes(m);
  alarmTime.setSeconds(0);

  const diff=alarmTime-now;

  if(diff>0){
    setTimeout(()=>{
      document.getElementById("alarm").play();
      showNotification(name);
    },diff);
  }
}

function completeTask(btn){
  document.getElementById("alarm").pause();
  document.getElementById("alarm").currentTime=0;
  btn.parentElement.remove();
}

function showNotification(task){
  if(Notification.permission==="granted"){
    new Notification("⏰ Task Reminder",{body:task});
  }
}

if("Notification"in window){
  Notification.requestPermission();
}

if("serviceWorker"in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>

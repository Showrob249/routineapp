<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Routine App</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#111;
  color:white;
  text-align:center;
  padding:20px;
}

h1{
  color:#00ffcc;
}

button{
  cursor:pointer;
}
.card{
  background:#222;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}
</style>

</head>
<body>

<h1>🔥 My Daily Routine</h1>

<h3>🔥 Streak: <span id="streak">0</span></h3>

<button onclick="enableNotifications()" 
style="padding:8px 15px;border:none;background:#00ffcc;color:black;border-radius:5px;">
Enable Notifications 🔔
</button>

<div id="routineList"></div>

<script>

// ================= ROUTINE LIST =================
const routine = [
  {name:'Wake Up', time:'06:00'},
  {name:'Trading (2 Hours)', time:'06:15'},
  {name:'Online Business', time:'09:00'},
  {name:'Facebook Page', time:'11:00'},
  {name:'Binance P2P', time:'13:00'}
];

// ================= LOAD DATA =================
let state = JSON.parse(localStorage.getItem('routineState')) || {};
let streak = Number(localStorage.getItem('streak')) || 0;

// ================= ENABLE NOTIFICATION =================
function enableNotifications(){
  if("Notification" in window){
    Notification.requestPermission().then(permission=>{
      if(permission==="granted"){
        alert("Notification Enabled ✅");
      }
    });
  }
}

// ================= SHOW REAL NOTIFICATION =================
function showNotification(title){
  if(Notification.permission==="granted"){
    new Notification(title,{
      body:"Routine Reminder 🔥",
      icon:"icon.png"
    });
  }
}

// ================= DAILY RESET =================
function dailyReset(){
  const now = new Date();
  const lastReset = localStorage.getItem("lastReset");
  const today = now.toDateString();

  if(lastReset !== today && now.getHours() >= 5){
    state = {};
    localStorage.setItem("routineState", JSON.stringify(state));
    localStorage.setItem("lastReset", today);
  }
}

dailyReset();

// ================= SAVE =================
function save(){
  localStorage.setItem('routineState', JSON.stringify(state));
  localStorage.setItem('streak', streak);
}

// ================= ALERT =================
function showAlert(msg){
  alert(msg);
}

// ================= MARK DONE =================
function markDone(name){
  state[name] = true;
  save();
  render();
  checkAllDone();
}

// ================= CHECK ALL DONE =================
function checkAllDone(){
  const allDone = routine.every(r => state[r.name]);
  if(allDone){
    streak++;
    save();
    showAlert("🔥 Great Job! Streak Increased!");
  }
}

// ================= CHECK MISSED =================
function checkMissed(){
  const now = new Date();
  const current = now.getHours().toString().padStart(2,'0') + ":" +
                  now.getMinutes().toString().padStart(2,'0');

  routine.forEach(r => {
    if(current > r.time && !state[r.name]){
      showNotification("⚠️ You missed: " + r.name);
    }
  });
}

// ================= TIME CHECK =================
function checkTime(){
  const now = new Date();
  const current = now.getHours().toString().padStart(2,'0') + ":" +
                  now.getMinutes().toString().padStart(2,'0');

  routine.forEach(r => {
    if(current === r.time){
      showNotification("⏰ Time for: " + r.name);
    }
  });
}

setInterval(checkTime,60000);
setInterval(checkMissed,60000);

// ================= RENDER =================
function render(){
  const container = document.getElementById("routineList");
  container.innerHTML = "";

  routine.forEach(r => {
    const div = document.createElement("div");
    div.className="card";

    const done = state[r.name];

    div.innerHTML = `
      <b>${r.name}</b> (${r.time}) <br><br>
      <button onclick="markDone('${r.name}')"
        style="background:${done?'green':'gray'};
        color:white;border:none;padding:8px 15px;border-radius:5px;">
        ${done?'Done':'Mark Done'}
      </button>
    `;

    container.appendChild(div);
  });

  document.getElementById("streak").innerText = streak;
}

render();

</script>

</body>
</html>

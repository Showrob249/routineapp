<!DOCTYPE html>
<html>
<head>
  <title>My Daily Routine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background: black;
      color: #00ffe0;
      text-align: center;
      font-family: Arial;
      padding: 20px;
    }
    input, button {
      padding: 10px;
      margin: 5px;
      border-radius: 8px;
      border: none;
    }
    button {
      background: #00ffe0;
      cursor: pointer;
      font-weight: bold;
    }
    .task {
      background: #111;
      margin: 10px;
      padding: 10px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<h1>🔥 My Daily Routine</h1>

<button onclick="enableNotification()">Enable Notifications</button>

<h2>Today's Progress</h2>

<div style="width:100%; background:#222; border-radius:20px; overflow:hidden;">
  <div id="progressBar" style="
    width:0%;
    height:20px;
    background:#00ff88;
    transition:0.5s;
  "></div>
</div>

<p id="progressText">0% Completed</p>

<h2>Add Task</h2>
<input type="text" id="taskName" placeholder="Task Name">
<input type="time" id="taskTime">
<button onclick="addTask()">Add</button>

<h2>Today's Schedule</h2>
<div id="taskList"></div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

function enableNotification() {
  Notification.requestPermission();
}

let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function saveTasks() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function renderTasks() {
  let list = document.getElementById("taskList");
  list.innerHTML = "";

  let today = new Date().toDateString();
  let completedCount = 0;

  tasks.forEach((task, index) => {

    if (task.lastCompletedDate !== today) {
      task.completed = false;
    }

    if (task.completed) completedCount++;

    list.innerHTML += `
      <div class="task" style="background:${task.completed ? '#003300' : '#111'}">
        <b style="text-decoration:${task.completed ? 'line-through' : 'none'}">
          ${task.name}
        </b> - ${task.time}
        <br>
        <button onclick="completeTask(${index})">✅</button>
        <button onclick="deleteTask(${index})">❌</button>
      </div>
    `;
  });

let activeAlarmIndex = null;
let alarm;

function initAlarm() {
  alarm = new Audio();
  alarm.src = "./alarm.mp3";
  alarm.loop = true;
}

function startAlarm(index) {
  activeAlarmIndex = index;

  if (!alarm) initAlarm();

  alarm.play().catch(err => {
    console.log("Autoplay blocked:", err);
  });
}

function stopAlarm() {
  if (alarm) {
    alarm.pause();
    alarm.currentTime = 0;
  }
  activeAlarmIndex = null;
}

// unlock audio after first click
document.addEventListener("click", function unlock() {
  initAlarm();
  alarm.play().then(() => {
    alarm.pause();
    alarm.currentTime = 0;
  });
  document.removeEventListener("click", unlock);
});

// 🔥 Progress Calculation
  let percent = tasks.length === 0
    ? 0
    : Math.round((completedCount / tasks.length) * 100);

  document.getElementById("progressBar").style.width = percent + "%";
  document.getElementById("progressText").innerText =
    percent + "% Completed (" + completedCount + "/" + tasks.length + ")";

  saveTasks();
}

function addTask() {
  let name = document.getElementById("taskName").value;
  let time = document.getElementById("taskTime").value;

  if (!name || !time) {
    alert("Enter task & time");
    return;
  }

  tasks.push({
    name,
    time,
    completed: false,
    lastCompletedDate: null,
    lastNotified: null
  });

  saveTasks();
  renderTasks();

  document.getElementById("taskName").value = "";
  document.getElementById("taskTime").value = "";
}

function deleteTask(index) {
  tasks.splice(index, 1);
  saveTasks();
  renderTasks();
}

function completeTask(index) {
  let today = new Date().toDateString();
  tasks[index].completed = true;
  tasks[index].lastCompletedDate = today;

  if (activeAlarmIndex === index) {
    stopAlarm();  // 🔥 Alarm বন্ধ করবে
  }

  saveTasks();
  renderTasks();
}

function showReminder(task) {
  navigator.serviceWorker.ready.then(reg => {
    reg.showNotification("🔔 " + task.name, {
      body: "Time to complete your task!",
      icon: "icon.png"
    });
  });
}

function checkReminder() {
  let now = new Date();
  let currentTime = now.toTimeString().slice(0,5);
  let today = now.toDateString();

  tasks.forEach((task, index) => {
    if (
      task.time === currentTime &&
      task.lastNotified !== today &&
      !task.completed
    ) {
      if (Notification.permission === "granted") {
        showReminder(task);
      }

      startAlarm(index);  // 🔥 Alarm start
      task.lastNotified = today;
      saveTasks();
    }
  });
}

setInterval(checkReminder, 60000);


renderTasks();

setTimeout(() => {
  let test = new Audio("./alarm.mp3");
  test.play();
}, 3000);

</script>

<audio id="alarmSound" src="alarm.mp3" loop></audio>

</body>
</html>
